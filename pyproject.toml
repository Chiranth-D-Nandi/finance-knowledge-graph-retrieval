[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-kg-retrieval"
version = "1.0.0"
description = "Entity-Resolved Temporal Knowledge Graph with Hybrid Financial Retrieval, Grounded QA, and Explainable Market Impact Analytics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chiranth D Nandi" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "networkx>=3.2.0",
    "trafilatura>=1.8.0",
    "yfinance>=0.2.38",
    "pandera>=0.18.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "arch>=6.2.0",
    "ruptures>=1.1.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
